<svg xmlns="http://www.w3.org/2000/svg" width="768" height="360" viewBox="0 0 1280 600" role="img" aria-labelledby="title desc">
<title id="title">目标协作方式：共享正文只改一处，Cloud 通过升级 PR 采用</title>
<desc id="desc">社区贡献者和文档工程师向 milvus-docs 提交共享内容，Milvus 沿用现有发布。文档工程师在 zdoc 维护 Cloud 差异与配置。上游合并或 zdoc 修改后，工具在 zdoc 发起升级 PR，生成页面、差异和影响提示。文档工程师审核：合并即采用并按 UAT / Prod 发布，暂缓则保持已批准版本；需要修改时回到对应的源文件。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#374151;}.head{font-size:21px;font-weight:600;text-anchor:middle;}.sub{font-size:17px;text-anchor:middle;fill:#64748b;}.lbl{font-size:16px;fill:#475569;}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow);}.back{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#arrow);}</style></defs>
<rect width="1280" height="600" fill="#ffffff"/>

<text x="140" y="30" class="sub" style="font-weight:600">谁</text>
<text x="465" y="30" class="sub" style="font-weight:600">改哪里</text>
<text x="810" y="30" class="sub" style="font-weight:600">工具</text>
<text x="1125" y="30" class="sub" style="font-weight:600">审核与发布</text>

<rect x="40" y="60" width="200" height="80" rx="12" fill="#a7f3d0" stroke="#047857"/>
<text x="140" y="108" class="head">社区贡献者</text>
<rect x="40" y="250" width="200" height="80" rx="12" fill="#93c5fd" stroke="#1e3a8a"/>
<text x="140" y="298" class="head">文档工程师</text>

<rect x="330" y="50" width="270" height="100" rx="12" fill="#fef3c7" stroke="#b45309"/>
<text x="465" y="88" class="head">milvus-docs</text><text x="465" y="120" class="sub">共享原文 · 唯一编辑源</text>
<rect x="330" y="330" width="270" height="100" rx="12" fill="#fef3c7" stroke="#b45309"/>
<text x="465" y="368" class="head">zdoc</text><text x="465" y="400" class="sub">Cloud 差异、配置与变量</text>

<path class="edge" d="M240 100 H323"/>
<path class="edge" d="M240 280 H285 V125 H323"/>
<path class="edge" d="M240 300 H285 V380 H323"/>
<text x="250" y="90" class="lbl">PR</text>

<rect x="1010" y="50" width="230" height="100" rx="12" fill="#ffffff" stroke="#64748b"/>
<text x="1125" y="88" class="head">Milvus 文档</text><text x="1125" y="120" class="sub">沿用现有发布</text>
<path class="edge" d="M600 100 H1003"/>

<rect x="690" y="190" width="240" height="120" rx="12" fill="#ddd6fe" stroke="#6d28d9"/>
<text x="810" y="228" class="head">zdoc 升级 PR</text><text x="810" y="260" class="sub">自动生成页面与差异</text><text x="810" y="286" class="sub">提示受影响的内容</text>
<path class="edge" d="M560 150 V170 H760 V183"/>
<text x="572" y="194" class="lbl">上游合并后自动发起</text>
<path class="edge" d="M600 380 H810 V317"/>
<text x="620" y="370" class="lbl">修改差异或配置</text>

<rect x="1010" y="190" width="230" height="120" rx="12" fill="#93c5fd" stroke="#1e3a8a"/>
<text x="1125" y="228" class="head">文档工程师审核</text><text x="1125" y="260" class="sub">合并：采用新版本</text><text x="1125" y="286" class="sub">暂缓：保持已批准版本</text>
<path class="edge" d="M930 250 H1003"/>

<rect x="1010" y="370" width="230" height="90" rx="12" fill="#ffffff" stroke="#64748b"/>
<text x="1125" y="408" class="head">Cloud 文档</text><text x="1125" y="438" class="sub">UAT / Prod</text>
<path class="edge" d="M1125 310 V363"/>

<path class="back" d="M1010 290 H965 V520 H465 V437"/>
<text x="490" y="548" class="lbl">需要修改：回到对应的源文件。共同内容改 milvus-docs，Cloud 差异改 zdoc；生成文件不能手改。</text>
</svg>
