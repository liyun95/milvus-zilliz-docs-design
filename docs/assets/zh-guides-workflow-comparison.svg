<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="808" viewBox="0 0 1280 808" role="img" aria-labelledby="title desc">
  <title id="title">中文 Guides 工作流：现状、日常更新与逐页切换</title>
  <desc id="desc">现在由文档工程师自行跟进英文、在飞书编辑、沿用现有发布流程。改造后工具为 Cloud 已采用的英文改动起草，文档工程师在 GitHub 审校。暂缓时保持原版，普通修订获批合入后随部署上线，新功能获批后先在 UAT 核对，发布负责人确认后随功能发版上线。逐页迁移先审校 Git 候选，文档负责人再发起切换。只有确认发布采用 Git，正文才在 Git 编辑。失败时保留线上版本，确认未切换后可恢复飞书编辑。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#64748b"/></marker>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; fill: #24334b; }
    .section { font-size: 26px; font-weight: 650; }
    .head { font-size: 22px; font-weight: 650; text-anchor: middle; }
    .body { font-size: 19px; text-anchor: middle; fill: #42536a; }
    .label { font-size: 17px; font-weight: 600; fill: #475569; }
    .edge, .branch { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    .branch { stroke-dasharray: 6 5; }
  </style>
  <rect width="1280" height="808" fill="#ffffff"/>
  <text class="section" x="32" y="40">现在怎么做 · 人工跟进英文，在飞书维护正文</text>
  <rect x="32" y="60" width="250" height="90" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
  <text class="head" x="157.0" y="96">Cloud 英文更新</text>
  <text class="body" x="157.0" y="125">按照现有流程采用</text>
  <rect x="324" y="60" width="285" height="90" rx="12" fill="#dbeafe" stroke="#3b6fa8"/>
  <text class="head" x="466.5" y="96">文档工程师自行跟进</text>
  <text class="body" x="466.5" y="125">人工对照，在飞书改中文</text>
  <rect x="651" y="60" width="255" height="90" rx="12" fill="#fef3c7" stroke="#b45309"/>
  <text class="head" x="778.5" y="96">飞书稿进入发布</text>
  <text class="body" x="778.5" y="125">沿用现有发布流程</text>
  <rect x="948" y="60" width="300" height="90" rx="12" fill="#e7f6ed" stroke="#338565"/>
  <text class="head" x="1098.0" y="96">中文站点更新</text>
  <text class="body" x="1098.0" y="125">部署成功后读者可见</text>
  <path class="edge" d="M282 105 H315"/>
  <path class="edge" d="M609 105 H642"/>
  <path class="edge" d="M906 105 H939"/>
  <path d="M32 174 H1248" stroke="#cbd5e1"/>
  <text class="section" x="32" y="211">改完怎么做 · 文档工程师在 GitHub 审校</text>
  <rect x="32" y="231" width="240" height="100" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
  <text class="head" x="152.0" y="267">Cloud 采用英文改动</text>
  <text class="body" x="152.0" y="296">已接入的中文页面</text>
  <rect x="318" y="231" width="240" height="100" rx="12" fill="#ede9fe" stroke="#7560af"/>
  <text class="head" x="438.0" y="267">工具起草受影响段落</text>
  <text class="body" x="438.0" y="296">附英文差异和中文预览</text>
  <rect x="608" y="231" width="260" height="100" rx="12" fill="#dbeafe" stroke="#3b6fa8"/>
  <text class="head" x="738.0" y="267">文档工程师审校</text>
  <text class="body" x="738.0" y="296">核对差异、修订或暂缓</text>
  <rect x="968" y="231" width="280" height="100" rx="12" fill="#e7f6ed" stroke="#338565"/>
  <text class="head" x="1108.0" y="267">普通修订</text>
  <text class="body" x="1108.0" y="296">部署成功后在正式站可见</text>
  <path class="edge" d="M272 281 H309"/>
  <path class="edge" d="M558 281 H599"/>
  <path class="edge" d="M868 281 H959"/>
  <text class="label" x="918" y="268" text-anchor="middle">批准合入</text>
  <rect x="32" y="400" width="270" height="104" rx="12" fill="#fff7ed" stroke="#b77942"/>
  <text class="head" x="167.0" y="436">暂缓或待补稿</text>
  <text class="body" x="167.0" y="465">正式站保留已发布版本</text>
  <rect x="608" y="400" width="260" height="104" rx="12" fill="#dbeafe" stroke="#3b6fa8"/>
  <text class="head" x="738.0" y="436">在预发布站（UAT）核对</text>
  <text class="body" x="738.0" y="465">正式站保持原版</text>
  <rect x="968" y="400" width="280" height="104" rx="12" fill="#e7f6ed" stroke="#338565"/>
  <text class="head" x="1108.0" y="436">正式站上线新说明</text>
  <text class="body" x="1108.0" y="465">随功能发版并部署</text>
  <path class="branch" d="M643 331 V366 H167 V391"/>
  <text class="label" x="365" y="356" text-anchor="middle">暂缓或尚未通过审校</text>
  <path class="edge" d="M738 331 V391"/>
  <text class="label" x="752" y="378">新功能获批合入</text>
  <path class="edge" d="M868 452 H959"/>
  <text class="label" x="918" y="438" text-anchor="middle">负责人确认</text>
  <path d="M32 529 H1248" stroke="#cbd5e1"/>
  <text class="section" x="32" y="566">逐页迁移 · 确认发布采用 Git 后，飞书退出正文维护</text>
  <rect x="32" y="586" width="242" height="105" rx="12" fill="#fef3c7" stroke="#b45309"/>
  <text class="head" x="153.0" y="622">飞书维护正文</text>
  <text class="body" x="153.0" y="651">在迁移清单查编辑入口</text>
  <rect x="316" y="586" width="260" height="105" rx="12" fill="#dbeafe" stroke="#3b6fa8"/>
  <text class="head" x="446.0" y="622">审校 Git 候选</text>
  <text class="body" x="446.0" y="651">比对正文、旧链接和图片</text>
  <rect x="618" y="586" width="270" height="105" rx="12" fill="#dbeafe" stroke="#3b6fa8"/>
  <text class="head" x="753.0" y="622">文档负责人发起切换</text>
  <text class="body" x="753.0" y="651">确认最后修改，暂停编辑</text>
  <rect x="930" y="586" width="318" height="105" rx="12" fill="#e7f6ed" stroke="#338565"/>
  <text class="head" x="1089.0" y="618">确认发布已采用 Git</text>
  <text class="body" x="1089.0" y="646">正文改在 Git，飞书管导航</text>
  <text class="body" x="1089.0" y="670">站点验收后标记旧稿</text>
  <path class="edge" d="M274 639 H307"/>
  <path class="edge" d="M576 639 H609"/>
  <path class="edge" d="M888 639 H921"/>
  <path class="branch" d="M753 691 V728"/>
  <text class="label" x="765" y="718">切换失败</text>
  <rect x="618" y="736" width="630" height="48" rx="10" fill="#fff7ed" stroke="#b77942"/>
  <text class="body" x="933" y="766">保留线上版本，确认未切换后可恢复飞书编辑</text>
</svg>
