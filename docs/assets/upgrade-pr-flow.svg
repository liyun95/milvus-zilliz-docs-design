<svg xmlns="http://www.w3.org/2000/svg" width="768" height="384" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
<title id="title">上游变化怎样成为 Cloud 的升级 PR</title>
<desc id="desc">社区或文档工程师向 milvus-docs 提交 PR，CI 检查命名块、变量和 Milvus 构建，合并后进入跟踪分支。zdoc 工具定时或按事件发现新提交，固定 commit 重新生成受影响的页面，比较整页、命名块和被替换原文的变化，然后在 zdoc 发起升级 PR，附 lock、生成结果差异和影响报告。如果命名块被删除或改名，旧版本继续有效，需要显式迁移。Cloud 文档工程师审核升级 PR：合并即采用并进入既有发布流程；暂不合并则保持已批准版本；需要修改时回到源文件。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#374151;}.head{font-size:18px;font-weight:600;text-anchor:middle;}.sub{font-size:15px;text-anchor:middle;fill:#64748b;}.lane{font-size:17px;font-weight:600;text-anchor:middle;}.warn{font-size:15px;fill:#b91c1c;}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow);}</style></defs>
<rect width="1280" height="640" fill="#ffffff"/>

<rect x="20" y="20" width="1240" height="120" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="20" y="150" width="1240" height="180" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="20" y="340" width="1240" height="180" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="20" y="530" width="1240" height="90" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<path d="M170 20 V140 M170 150 V330 M170 340 V520 M170 530 V620" stroke="#cbd5e1"/>
<text x="95" y="85" class="lane">milvus-docs</text>
<text x="95" y="245" class="lane">zdoc 工具</text>
<text x="95" y="425" class="lane">Cloud 文档</text><text x="95" y="449" class="lane">工程师</text>
<text x="95" y="581" class="lane">发布</text>

<rect x="190" y="40" width="160" height="80" rx="10" fill="#a7f3d0" stroke="#047857"/>
<text x="270" y="72" class="head">提交 PR</text><text x="270" y="98" class="sub">社区或文档工程师</text>
<rect x="370" y="40" width="160" height="80" rx="10" fill="#ddd6fe" stroke="#6d28d9"/>
<text x="450" y="68" class="head">CI 检查</text><text x="450" y="92" class="sub">命名块 · 变量</text><text x="450" y="112" class="sub">Milvus 构建</text>
<rect x="550" y="40" width="160" height="80" rx="10" fill="#fef3c7" stroke="#b45309"/>
<text x="630" y="72" class="head">合并</text><text x="630" y="98" class="sub">进入跟踪分支</text>
<path class="edge" d="M350 80 H363"/><path class="edge" d="M530 80 H543"/>

<path class="edge" d="M630 120 V163"/>
<rect x="550" y="170" width="160" height="80" rx="10" fill="#ddd6fe" stroke="#6d28d9"/>
<text x="630" y="198" class="head">发现新提交</text><text x="630" y="222" class="sub">定时或事件触发</text><text x="630" y="242" class="sub">合并重复事件</text>
<rect x="730" y="170" width="160" height="80" rx="10" fill="#ddd6fe" stroke="#6d28d9"/>
<text x="810" y="198" class="head">重新生成</text><text x="810" y="222" class="sub">固定 commit</text><text x="810" y="242" class="sub">比较变化</text>
<rect x="910" y="170" width="160" height="80" rx="10" fill="#ddd6fe" stroke="#6d28d9"/>
<text x="990" y="198" class="head">发起升级 PR</text><text x="990" y="222" class="sub">lock · 生成差异</text><text x="990" y="242" class="sub">影响报告</text>
<path class="edge" d="M710 210 H723"/><path class="edge" d="M890 210 H903"/>

<path d="M810 250 V266" stroke="#b91c1c" stroke-width="2" stroke-dasharray="4 4"/>
<rect x="550" y="266" width="340" height="56" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-dasharray="6 4"/>
<text x="566" y="290" class="warn">命名块被删除或改名：阻止升级，</text>
<text x="566" y="313" class="warn">旧版本继续有效，需要显式迁移</text>

<path class="edge" d="M990 250 V393"/>
<rect x="910" y="400" width="160" height="80" rx="10" fill="#93c5fd" stroke="#1e3a8a"/>
<text x="990" y="432" class="head">审核升级 PR</text><text x="990" y="458" class="sub">产品适用性与差异</text>

<rect x="1110" y="352" width="140" height="44" rx="8" fill="#ffffff" stroke="#64748b"/>
<text x="1180" y="380" class="sub" style="fill:#374151">修改：回到源文件</text>
<rect x="1110" y="406" width="140" height="44" rx="8" fill="#ffffff" stroke="#64748b"/>
<text x="1180" y="434" class="sub" style="fill:#374151">暂缓：保持旧版本</text>
<rect x="1110" y="460" width="140" height="44" rx="8" fill="#ffffff" stroke="#047857" stroke-width="2"/>
<text x="1180" y="488" class="sub" style="fill:#047857;font-weight:600">合并：采用新版本</text>
<path d="M1070 440 H1086 M1086 374 V482" stroke="#64748b" stroke-width="2" fill="none"/>
<path class="edge" d="M1086 374 H1103"/><path class="edge" d="M1086 428 H1103"/><path class="edge" d="M1086 482 H1103"/>

<path class="edge" d="M1180 504 V543"/>
<rect x="910" y="550" width="340" height="56" rx="10" fill="#ffffff" stroke="#64748b"/>
<text x="1080" y="584" class="head" style="font-size:17px">既有发布流程：UAT → Prod</text>

<text x="190" y="390" class="sub" style="text-anchor:start">比较范围：整页、直接与间接引用的命名块、</text>
<text x="190" y="414" class="sub" style="text-anchor:start">被替换的原文、变量与资源。</text>
<text x="190" y="446" class="sub" style="text-anchor:start">被替换的原文变了，即使 Cloud 输出不变也提示复核；</text>
<text x="190" y="470" class="sub" style="text-anchor:start">只新增标记、正文未变，不触发重译。</text>
</svg>
