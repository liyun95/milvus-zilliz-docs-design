<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="545" viewBox="0 0 1240 545" role="img" aria-labelledby="title desc">
<title id="title">日常运转：从英文变化到主审合入或暂缓</title>
<desc id="desc">工具工作日北京时间 08:00 定时或手动扫描英文变化，先由程序定位差异，存量页局部起草、新注册页起草首译并执行代码块保护与双通道校验，材料齐备后按页发 Ready for review 滚动 PR 并推飞书日报提醒。文档工程师核对预览与待确认项，决定批准合入（推进基线并由沿用的 Fetch 与部署上线），或短期暂缓（挂 deferred 标签）/ 长期时间差（关 PR 记账，基线不动）。</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
</defs>
<style>
  text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;text-anchor:middle;fill:#334155}
  .head{font-size:19.5px;font-weight:600}
  .sub{font-size:15px;fill:#475569}
  .lane{font-size:18.5px;font-weight:600}
  .cap{font-size:14.5px;fill:#475569}
  .change{font-size:15.5px;fill:#a53c06;font-weight:600}
  .edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
  .stem{fill:none;stroke:#64748b;stroke-width:2}
</style>
<rect width="1240" height="545" fill="white"/>

<!-- Lane 1 background: 工具准备 -->
<rect x="12" y="14" width="1216" height="172" rx="12" fill="white" stroke="#94a3b8"/>
<path d="M132 14 v172" stroke="#94a3b8"/>
<text x="72" y="92" class="lane">工具准备</text>
<text x="72" y="118" class="cap">08:00 / 手动</text>

<!-- Orange dashed new-scope frame in Lane 1 -->
<rect x="144" y="24" width="1072" height="150" rx="10" fill="#fffaf5" stroke="#c2410c" stroke-dasharray="7 5"/>
<text x="680" y="45" class="change">本期新增 · 自动差异检测、受限起草与滚动 PR 推送</text>

<rect x="158" y="56" width="290" height="104" rx="10" fill="#ddd6fe" stroke="#6d28d9"/>
<text x="303" y="88" class="head">① 程序比对英文变化</text>
<text x="303" y="115" class="sub">对比上次已审与最新英文</text>
<text x="303" y="140" class="cap">无变化跳过 · 来源不明整页阻塞</text>

<rect x="490" y="56" width="322" height="104" rx="10" fill="#ddd6fe" stroke="#6d28d9"/>
<text x="651" y="88" class="head">② 起草中文并跑检查</text>
<text x="651" y="115" class="sub">存量页局部改稿 · 新页起草首译</text>
<text x="651" y="140" class="cap">代码不交模型 + 逐字保留 + 双通道校验</text>

<rect x="854" y="56" width="348" height="104" rx="10" fill="#ddd6fe" stroke="#6d28d9"/>
<text x="1028" y="88" class="head">③ 发滚动 PR 并发飞书提醒</text>
<text x="1028" y="115" class="sub">附差异、待确认项与两通道预览</text>
<text x="1028" y="140" class="cap">材料齐备即 Ready for review</text>

<path class="edge" d="M448 108 H483"/>
<path class="edge" d="M812 108 H847"/>

<!-- Lane 2 background: 文档工程师 -->
<rect x="12" y="226" width="1216" height="256" rx="12" fill="white" stroke="#94a3b8"/>
<path d="M132 226 v256" stroke="#94a3b8"/>
<text x="72" y="346" class="lane">文档工程师</text>
<text x="72" y="372" class="cap">PR 审校决定</text>

<!-- Orange dashed new-scope frame in Lane 2 (wraps ④ + ⑤a + ⑤b, leaves ⑥ outside as existing/extended!) -->
<rect x="144" y="236" width="706" height="234" rx="10" fill="#fffaf5" stroke="#c2410c" stroke-dasharray="7 5"/>
<text x="497" y="256" class="change">本期新增 · PR 必审门禁与暂缓管理</text>

<!-- Bridge between Lane 1 and Lane 2 (drawn after Lane 2 background) -->
<path class="edge" d="M1028 160 V206 H303 V289"/>
<text x="665" y="199" class="cap">审校中同页英文再变：原 PR 追加更新并保留人工修订（重叠冲突则暂停自动写入）</text>

<rect x="158" y="296" width="286" height="118" rx="10" fill="#dbeafe" stroke="#2563eb"/>
<text x="301" y="330" class="head">④ 主审在 PR 中核对</text>
<text x="301" y="359" class="sub">看英文变了什么 · 查两通道预览</text>
<text x="301" y="385" class="cap">处理待确认项或直接修订正文</text>

<!-- Split branch from Box 4 -->
<path class="stem" d="M444 355 H476 M476 312 V414"/>
<path class="edge" d="M476 312 H502"/>
<path class="edge" d="M476 414 H502"/>

<!-- Upper outcome: 合入 -->
<rect x="509" y="268" width="328" height="88" rx="10" fill="#f0fdf4" stroke="#047857" stroke-width="2"/>
<text x="673" y="298" class="head" style="fill:#065f46">⑤a 清零待办并 Approve 合入</text>
<text x="673" y="324" class="sub">最新 head 过检后合入 master</text>
<text x="673" y="346" class="cap">只有合入才推进已审英文基线</text>

<path class="edge" d="M837 312 H876"/>

<!-- Box 6: Existing/extended Fetch & deploy (outside orange new-scope box!) -->
<rect x="883" y="268" width="330" height="88" rx="10" fill="white" stroke="#64748b"/>
<text x="1048" y="298" class="head">⑥ Fetch 取稿并部署上线</text>
<text x="1048" y="324" class="sub">扩展中文 Fetch 写入 dev（沿用部署）</text>
<text x="1048" y="346" class="cap">对应站点部署成功才算上线</text>

<!-- Lower outcome: 暂缓 (spans clearly inside & notes long-term close) -->
<rect x="509" y="370" width="328" height="88" rx="10" fill="#fffbeb" stroke="#b45309" stroke-dasharray="6 4"/>
<text x="673" y="398" class="head" style="fill:#92400e">⑤b 暂缓 / 挂起（不阻塞他页）</text>
<text x="673" y="423" class="sub">短期：留 PR 贴 deferred 标签</text>
<text x="673" y="445" class="cap">长期时间差：关 PR 在清单记账，基线不动</text>

<!-- Side note for ⑤b -->
<rect x="883" y="370" width="330" height="88" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/>
<text x="1048" y="398" class="sub" style="font-weight:600;fill:#334155">暂缓跟进规则</text>
<text x="1048" y="422" class="cap">无新实质变化不重复催办；有新变化</text>
<text x="1048" y="443" class="cap">通知一次（列新增 + 累计差异）</text>
<path class="stem" d="M837 414 H883" stroke-dasharray="4 3"/>

<!-- Legend -->
<g aria-label="图例" font-size="15">
  <text x="45" y="518" class="head">图例</text>
  <rect x="86" y="502" width="24" height="20" rx="4" fill="#ddd6fe" stroke="#6d28d9"/>
  <text x="118" y="517" style="text-anchor:start">工具自动处理</text>
  <rect x="234" y="502" width="24" height="20" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="266" y="517" style="text-anchor:start">文档工程师审校</text>
  <rect x="396" y="502" width="24" height="20" rx="4" fill="#f0fdf4" stroke="#047857" stroke-width="2"/>
  <text x="428" y="517" style="text-anchor:start">批准合入</text>
  <rect x="514" y="502" width="24" height="20" rx="4" fill="#fffbeb" stroke="#b45309" stroke-dasharray="5 3"/>
  <text x="546" y="517" style="text-anchor:start">暂缓 / 挂起</text>
  <rect x="652" y="502" width="24" height="20" rx="4" fill="white" stroke="#64748b"/>
  <text x="684" y="517" style="text-anchor:start">沿用 / 扩展发布</text>
  <rect x="820" y="502" width="24" height="20" rx="4" fill="#fffaf5" stroke="#c2410c" stroke-dasharray="5 3"/>
  <text x="852" y="517" style="text-anchor:start">本期新增范围</text>
</g>
</svg>
