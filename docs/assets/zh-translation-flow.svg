<rect x="20" y="340" width="1240" height="180" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="20" y="530" width="1240" height="90" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<path d="M170 20 V140 M170 150 V330 M170 340 V520 M170 530 V620" stroke="#cbd5e1"/>
<text x="95" y="85" class="lane">英文输入</text>
<text x="95" y="245" class="lane">翻译工具</text>
<text x="95" y="425" class="lane">文档</text><text x="95" y="449" class="lane">工程师</text>
<text x="95" y="581" class="lane">发布</text>

<rect x="190" y="40" width="220" height="80" rx="10" fill="#a7f3d0" stroke="#047857"/>
<text x="300" y="72" class="head">Shared Docs 英文生成</text><text x="300" y="98" class="sub">shared-docs/guides/pages/*</text>
<rect x="440" y="40" width="220" height="80" rx="10" fill="#a7f3d0" stroke="#047857"/>
<text x="550" y="72" class="head">Cloud 独有英文文档</text><text x="550" y="98" class="sub">统一组装完成的 MDX</text>
<rect x="700" y="40" width="180" height="80" rx="10" fill="#fef3c7" stroke="#b45309"/>
<text x="790" y="72" class="head">合并到 master</text><text x="790" y="98" class="sub">形成新的英文 commit</text>
<path class="edge" d="M410 80 H433"/><path class="edge" d="M660 80 H693"/>

<path class="edge" d="M790 120 V163"/>
<rect x="520" y="170" width="170" height="80" rx="10" fill="#ddd6fe" stroke="#6d28d9"/>
<text x="605" y="198" class="head">发现英文变更</text><text x="605" y="222" class="sub">工作日定时 09:30</text><text x="605" y="242" class="sub">去抖聚合 · 支持手动</text>
<rect x="715" y="170" width="190" height="80" rx="10" fill="#ddd6fe" stroke="#6d28d9"/>
<text x="810" y="198" class="head">语义 3-way 翻译</text><text x="810" y="222" class="sub">base_en + new_en</text><text x="810" y="242" class="sub">以 cur_zh 现有中文为底稿</text>
<rect x="930" y="170" width="180" height="80" rx="10" fill="#ddd6fe" stroke="#6d28d9"/>
<text x="1020" y="198" class="head">发起单页滚动 PR</text><text x="1020" y="222" class="sub">改 localized-docs</text><text x="1020" y="242" class="sub">附差异与审阅说明</text>
<path class="edge" d="M690 210 H708"/><path class="edge" d="M905 210 H923"/>

<path d="M810 250 V266" stroke="#b91c1c" stroke-width="2" stroke-dasharray="4 4"/>
<rect x="520" y="266" width="385" height="56" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-dasharray="6 4"/>
