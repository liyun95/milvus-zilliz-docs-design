<svg xmlns="http://www.w3.org/2000/svg" width="768" height="324" viewBox="0 0 1280 540" role="img" aria-labelledby="title desc">
<title id="title">一个页面从飞书切换到 Git 的三个状态</title>
<desc id="desc">准备中：飞书仍是该页的正式来源并照常更新，Git 输入只生成预览；构建失败、取消或发布基线变化时保持原状并重新生成。切换前核对最新飞书修订。候选通过审核且发布基线未变时进入激活：一个受控的 dev 提交同时写入生效配置、正文、导航和来源记录，旧飞书任务同时失去该页写权。之后进行站点部署，进入已切换：正式来源是 Git，飞书任务不能写入或删除该页，编辑入口是 milvus-docs 和 zdoc；部署失败时重试或镜像回滚，来源仍是 Git。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#374151;}.head{font-size:22px;font-weight:600;}.t{font-size:17px;fill:#475569;}.lbl{font-size:16px;fill:#475569;text-anchor:middle;}.band{font-size:16px;font-weight:600;text-anchor:middle;}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow);}.loop{fill:none;stroke:#94a3b8;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#arrow);}</style></defs>
<rect width="1280" height="540" fill="#ffffff"/>

<text x="40" y="34" class="t" style="font-weight:600">该页的正式来源</text>
<rect x="40" y="48" width="340" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="210" y="71" class="band" style="fill:#475569">飞书</text>
<rect x="470" y="48" width="770" height="34" rx="6" fill="#fef3c7" stroke="#b45309"/><text x="855" y="71" class="band" style="fill:#92400e">Git（milvus-docs + zdoc）</text>

<rect x="40" y="110" width="340" height="220" rx="14" fill="#ffffff" stroke="#64748b"/>
<text x="64" y="150" class="head">准备中</text>
<text x="64" y="190" class="t">· 飞书照常更新该页</text>
<text x="64" y="222" class="t">· Git 输入只生成预览</text>
<text x="64" y="254" class="t">· 整理 Git 输入，影子对照</text>
<text x="64" y="300" class="t" style="fill:#b45309;font-weight:600">切换前核对最新飞书修订</text>

<rect x="470" y="110" width="340" height="220" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="494" y="150" class="head">激活</text>
<text x="494" y="190" class="t">一个受控的 dev 提交同时写入：</text>
<text x="494" y="222" class="t">生效配置、正文、导航、来源记录</text>
<text x="494" y="262" class="t">旧飞书任务同时失去该页写权</text>
<text x="494" y="300" class="t" style="font-size:15px;fill:#64748b">队列串行不能代替这一同批提交</text>

<rect x="900" y="110" width="340" height="220" rx="14" fill="#ffffff" stroke="#64748b"/>
<text x="924" y="150" class="head">已切换</text>
<text x="924" y="190" class="t">· 从批准的 Git 输入生成</text>
<text x="924" y="222" class="t">· 飞书任务不能写入或删除</text>
<text x="924" y="254" class="t">· 编辑入口：milvus-docs / zdoc</text>

<path class="edge" d="M380 220 H463"/>
<text x="425" y="198" class="lbl">审核通过</text>
<text x="425" y="250" class="lbl">基线未变</text>
<path class="edge" d="M810 220 H893"/>
<text x="855" y="208" class="lbl">站点部署</text>

<path class="loop" d="M140 330 V392 H280 V337"/>
<text x="210" y="420" class="lbl">构建失败、取消或基线变化：</text>
<text x="210" y="444" class="lbl">保持原状，重新生成</text>

<path class="loop" d="M1000 330 V392 H1140 V337"/>
<text x="1070" y="420" class="lbl">部署失败：重试或镜像回滚，</text>
<text x="1070" y="444" class="lbl">来源仍是 Git，不回到飞书</text>

<text x="40" y="506" class="t" style="font-size:16px;fill:#64748b">提交配置或生成预览都不代表已切换。未迁移的页面照常走飞书；同一页任一时刻只有一个正式来源。</text>
</svg>
