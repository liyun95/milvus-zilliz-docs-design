<svg xmlns="http://www.w3.org/2000/svg" width="768" height="252" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
<title id="title">项目路线：首期分 1a 与 1b，后续扩大迁移</title>
<desc id="desc">1a 用 Delete Entities 跑通整篇复用，从固定源生成到 UAT 预览，不写生产，建议年底前完成。1b 用 Filtered Search 与 OpenAI 验证章节替换、代码行指令和 Next 包裹，上游变化以升级 PR 采用，接入发布、翻译与恢复，并正式切换试点页。后续分批迁移共享页和 Cloud 独有页，导航与媒体等依赖清零后停止飞书抓取与调度。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#374151;}.head{font-size:22px;font-weight:600;text-anchor:middle;}.band{font-size:18px;font-weight:600;fill:#64748b;text-anchor:middle;}.item{font-size:18px;fill:#374151;}.chip{font-size:16px;font-weight:600;fill:#92400e;text-anchor:middle;}.note{font-size:16px;fill:#b45309;text-anchor:middle;}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow);}</style></defs>
<rect width="1280" height="420" fill="#ffffff"/>

<text x="440" y="36" class="band">首期</text>
<path d="M20 48 H860" stroke="#94a3b8" stroke-width="2"/>
<text x="1072" y="36" class="band">后续</text>
<path d="M900 48 H1262" stroke="#cbd5e1" stroke-width="2"/>

<rect x="20" y="70" width="350" height="290" rx="14" fill="#ffffff" stroke="#64748b"/>
<text x="195" y="112" class="head">1a · 整篇复用跑通</text>
<rect x="72" y="130" width="246" height="34" rx="17" fill="#fef3c7" stroke="#b45309"/>
<text x="195" y="153" class="chip">Delete Entities</text>
<text x="48" y="208" class="item">· md2md 预处理入口</text>
<text x="48" y="244" class="item">· 固定源 → 变量 → Tabs / MDX</text>
<text x="48" y="280" class="item">· 进入 UAT 预览，不写生产</text>
<text x="48" y="316" class="item">· Milvus 发布回归通过</text>

<path class="edge" d="M370 215 H404"/>

<rect x="410" y="70" width="450" height="290" rx="14" fill="#ffffff" stroke="#64748b"/>
<text x="635" y="112" class="head">1b · 差异、升级与切换</text>
<rect x="487" y="130" width="296" height="34" rx="17" fill="#fef3c7" stroke="#b45309"/>
<text x="635" y="153" class="chip">Filtered Search · OpenAI</text>
<text x="438" y="208" class="item">· 章节替换、代码行指令、Next 包裹</text>
<text x="438" y="244" class="item">· 上游变化 → zdoc 升级 PR</text>
<text x="438" y="280" class="item">· 接入正式发布、翻译与恢复</text>
<text x="438" y="316" class="item">· 试点页正式切换上线</text>

<path class="edge" d="M860 215 H894"/>

<rect x="900" y="70" width="362" height="290" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 5"/>
<text x="1081" y="112" class="head">扩大迁移</text>
<rect x="981" y="130" width="200" height="34" rx="17" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="1081" y="153" class="chip" style="fill:#475569">按批次推进</text>
<text x="928" y="208" class="item">· 分批迁移共享页</text>
<text x="928" y="244" class="item">· Cloud 独有页迁入 Git</text>
<text x="928" y="280" class="item">· 导航、媒体等依赖清零</text>
<text x="928" y="316" class="item">· 停止飞书抓取与调度</text>

<path d="M390 64 V392" stroke="#b45309" stroke-width="2" stroke-dasharray="5 5"/>
<text x="390" y="410" class="note">建议年底完成 1a</text>
</svg>
