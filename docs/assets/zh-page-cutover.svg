<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="412" viewBox="0 0 1100 412" role="img" aria-labelledby="title desc">
  <title id="title">中文页面逐页切流</title>
  <desc id="desc">飞书仍为发布来源时导出和审核 Git 候选。换 Docs 只提交激活请求。Fetch 通过后同一个 dev 提交写入产物、导航、链接映射、独立激活记录和来源凭据，并转移正文写权。失败按激活状态恢复。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#61718a"/></marker>
    <style>
      text { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1e293b; }
      .title { font-size: 25px; font-weight: 650; }
      .head { font-size: 22px; font-weight: 650; }
      .body { font-size: 18px; fill: #42536a; }
      .edge { fill: none; stroke: #61718a; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1100" height="412" fill="#ffffff"/>
  <text class="title" x="24" y="42">中文页面逐页切流</text>
  <rect x="24" y="72" width="234" height="152" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="head" x="42" y="105">飞书维护</text>
  <text class="body" x="42" y="135">飞书正文仍供发布</text>
  <text class="body" x="42" y="160">记录修订、slug、</text>
  <text class="body" x="42" y="185">通道与发布目标</text>
  <rect x="296" y="72" width="234" height="152" rx="12" fill="#eff6ff" stroke="#93b9eb"/>
  <text class="head" x="314" y="105">Git 候选</text>
  <text class="body" x="314" y="135">固定修订，分批 PR</text>
  <text class="body" x="314" y="160">比对正文、锚点、</text>
  <text class="body" x="314" y="185">导航和媒体</text>
  <rect x="568" y="72" width="234" height="152" rx="12" fill="#fff7e8" stroke="#e7b56e"/>
  <text class="head" x="586" y="105">待激活</text>
  <text class="body" x="586" y="135">核对修订后冻结正文</text>
  <text class="body" x="586" y="160">换 Docs，等待 Fetch</text>
  <text class="body" x="586" y="185">站点保留已发布版本</text>
  <rect x="840" y="72" width="236" height="152" rx="12" fill="#edf9f2" stroke="#8dc9a6"/>
  <text class="head" x="858" y="105">Git 已激活</text>
  <text class="body" x="858" y="135">同一 dev 提交凭据</text>
  <text class="body" x="858" y="160">与产物一起生效</text>
  <text class="body" x="858" y="185">Git 取得正文写权</text>
  <path class="edge" d="M258 148 H288"/>
  <path class="edge" d="M530 148 H560"/>
  <path class="edge" d="M802 148 H832"/>
  <path class="edge" d="M670 224 V249"/>
  <path class="edge" d="M958 224 V249"/>
  <rect x="24" y="258" width="658" height="133" rx="12" fill="#fff2ef" stroke="#e3aa9e"/>
  <text class="head" x="42" y="291">激活失败</text>
  <text class="body" x="42" y="321">保留原 dev 产物和激活状态。确认请求未写入后可撤回换链。</text>
  <text class="body" x="42" y="346">结果未知时核实远端，再决定后续操作。</text>
  <rect x="714" y="258" width="362" height="133" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="head" x="732" y="291">部署失败</text>
  <text class="body" x="732" y="321">重试或回滚镜像，Git 保持写权。</text>
  <text class="body" x="732" y="346">首期保留 Base 导航记录。</text>
</svg>
