<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="448" viewBox="0 0 1240 448" role="img" aria-labelledby="title desc">
<title id="title">一页从飞书到 Git 的交接</title><desc id="desc">从飞书导出的候选稿先走人审。短暂停改、核对最后修订，再改飞书链接。Fetch 在同一 dev 提交中接管正文、导航、链接映射并留下来源记录。确认采用 Git 后更新编辑入口，部署后验收原网址和图片。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker></defs>
<style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;text-anchor:middle;fill:#374151}.head{font-size:21px;font-weight:600}.sub{font-size:17px;fill:#475569}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1240" height="448" fill="white"/>
<rect x="12" y="14" width="1216" height="148" rx="12" fill="white" stroke="#64748b"/>
<path d="M127 14 v148" stroke="#64748b"/>
<text x="70" y="84.0" class="head">文档团队</text>
<text x="70" y="111.0" class="sub">准备这一页</text>
<rect x="12" y="214" width="1216" height="194" rx="12" fill="white" stroke="#64748b"/>
<path d="M127 214 v194" stroke="#64748b"/>
<text x="70" y="307.0" class="head">发布与交接</text>
<text x="70" y="334.0" class="sub">按页确认</text>
<rect x="148" y="39" width="251" height="96" rx="10" fill="#ddd6fe" stroke="#6d28d9"/>
<text x="273.5" y="81.0" class="head">① Fetch 读取飞书中文</text>
<text x="273.5" y="105.0" class="sub">飞书仍可编辑</text>
<rect x="435" y="39" width="317" height="96" rx="10" fill="#93c5fd" stroke="#1e3a8a"/>
<text x="593.5" y="81.0" class="head">② 文档工程师审导入 PR</text>
<text x="593.5" y="105.0" class="sub">核对来源修订、英文和预览</text>
<rect x="796" y="39" width="407" height="96" rx="10" fill="#93c5fd" stroke="#1e3a8a"/>
<text x="999.5" y="81.0" class="head">③ 负责人暂停该页编辑</text>
<text x="999.5" y="105.0" class="sub">复核最后修订，再把飞书 Docs 指向 Git</text>
<path class="edge" d="M399 87 H429"/>
<path class="edge" d="M752 87 H790"/>
<path class="edge" d="M1000 135 V187 H273 V233"/>
<text x="637" y="180" class="sub">换链接发起切换；等待期间原站继续服务</text>
<rect x="148" y="240" width="251" height="96" rx="10" fill="#ddd6fe" stroke="#6d28d9"/>
<text x="273.5" y="270.0" class="head">④ Fetch 核验并接管</text>
<text x="273.5" y="294.0" class="sub">同一 dev 提交记录来源</text>
<text x="273.5" y="318.0" class="sub">写入正文、导航和旧链接映射</text>
<rect x="447" y="240" width="305" height="96" rx="10" fill="#93c5fd" stroke="#1e3a8a"/>
<text x="599.5" y="282.0" class="head">⑤ 负责人确认已采用 Git</text>
<text x="599.5" y="306.0" class="sub">清单中的正文编辑入口改为 Git</text>
<rect x="798" y="240" width="405" height="96" rx="10" fill="#fff" stroke="#64748b"/>
<text x="1000.5" y="270.0" class="head">⑥ 部署后验收中文站</text>
<text x="1000.5" y="294.0" class="sub">打开旧 URL、段落链接和图片</text>
<text x="1000.5" y="318.0" class="sub">通过后，在旧飞书正文标记已迁移</text>
<path class="edge" d="M399 288 H441"/>
<path class="edge" d="M752 288 H792"/>
<text x="633" y="383" class="sub">尚未激活可撤回并恢复飞书编辑；结果不明继续停改核实；已激活后部署失败，正文仍归 Git。</text>
<text x="620" y="435" class="sub">只有这一页转交正文编辑权，飞书记录继续管理导航。</text>
</svg>
