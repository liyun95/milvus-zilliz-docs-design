<text x="682" y="33" class="sub">中间内容</text>
<text x="913" y="33" class="sub">站点构建与发布</text>
<text x="1145" y="33" class="sub">文档站</text>
<rect x="15" y="54" width="1250" height="290" rx="14" fill="#ffffff" stroke="#64748b"/>
<rect x="15" y="380" width="1250" height="330" rx="14" fill="#ffffff" stroke="#64748b"/>
<path d="M125 54 V344 M125 380 V710" stroke="#64748b"/>
