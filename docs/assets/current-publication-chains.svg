<svg xmlns="http://www.w3.org/2000/svg" width="768" height="498" viewBox="0 0 1280 830" role="img" aria-labelledby="title desc">
<title id="title">Milvus 与 Cloud 的现有发布工具链</title>
<desc id="desc">两条独立的内容消费链。Milvus 原始 Markdown 经 md2md 转换写入 web-content，生成站点内容，再触发 milvus.io 通过子模块读取内容、构建并部署镜像。Cloud 从飞书出发，由 zdoc 抓取、渲染、组装和校验，将校验后的生成内容写入 dev，按需翻译回写，再由 zdoc 内的 Docusaurus 构建，并接入 README 描述的外部 Jenkins 发布系统；外部运行配置待核验。实线表示内容消费或处理顺序，点线表示工作流触发。</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
<style>
text {font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#374151;}
.head{font-size:20px;font-weight:600;text-anchor:middle;}
.sub{font-size:17px;text-anchor:middle;fill:#64748b;}
.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow);}
</style>
</defs>
