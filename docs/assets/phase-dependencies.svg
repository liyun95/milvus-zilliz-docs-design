<text x="990" y="399" class="h">翻译与恢复</text><text x="990" y="422" class="s">过滤 · 通道回归</text>
<rect x="1090" y="372" width="160" height="66" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="1170" y="399" class="h">试点页切换</text><text x="1170" y="422" class="s">上线并验证</text>

<rect x="210" y="472" width="1040" height="52" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="730" y="503" class="s" style="fill:#475569">从第一天开始核实：Jenkins 接线、分支权限、图片与镜像保留、Release Channel 迁移位置 —— 切换前必须解决</text>

