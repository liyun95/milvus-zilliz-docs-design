<rect x="20" y="460" width="1240" height="76" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
<text x="100" y="100" class="lane">内容</text><text x="100" y="122" class="lane2">milvus-docs · 文档</text>
<text x="100" y="200" class="lane">zdoc 生成</text><text x="100" y="222" class="lane2">获取 · 组装 · 更新</text>
<text x="100" y="300" class="lane">md2md</text><text x="100" y="322" class="lane2">预处理与标记清理</text>
<text x="100" y="400" class="lane">zdoc 发布</text><text x="100" y="422" class="lane2">来源 · 激活 · 翻译</text>
<text x="100" y="496" class="lane">运行条件</text><text x="100" y="516" class="lane2">运维 · 权限</text>
<path d="M710 56 V540" stroke="#b45309" stroke-width="2" stroke-dasharray="5 5"/>
<text x="710" y="558" class="lbl" style="text-anchor:middle;fill:#b45309;font-weight:600">建议年底完成 1a</text>

<rect x="210" y="72" width="220" height="66" rx="8" fill="#fef3c7" stroke="#b45309"/>
<text x="320" y="99" class="h">Delete Entities</text><text x="320" y="122" class="s">内容对齐 · 加变量</text>
