<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="768" height="516" viewBox="0 0 1280 860" role="img" aria-labelledby="title desc">
<title id="title">OpenAI 页的差异怎样表达</title>
<desc id="desc">OpenAI 页分三部分。第一部分是共享正文，写在 milvus-docs，产品名写成变量，两端分别绑定。第二部分是前提条件一节：Milvus 原文讲配置 milvus.yaml，Cloud 讲在控制台创建集成；milvus-docs 为这一节加命名块，zdoc 用页面配置和片段替换。第三部分是代码中的凭证参数：两行都写在 milvus-docs 的共享代码中，用产品行指令标记；Milvus 发布时删去 zilliz 行，只保留注释掉的可选 credential；Cloud 生成时删去 milvus 行，只保留必填的 integration_id。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#374151;}.h{font-size:20px;font-weight:600;}.t{font-size:17px;fill:#475569;}.s{font-size:15px;fill:#64748b;}.code{white-space:pre;font-family:'SF Mono',Menlo,Consolas,monospace;font-size:15px;fill:#1f2937;}.cmt{white-space:pre;font-family:'SF Mono',Menlo,Consolas,monospace;font-size:15px;fill:#1d4ed8;font-weight:600;}.link{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:4 4;}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow);}</style></defs>
<rect width="1280" height="860" fill="#ffffff"/>

<text x="370" y="28" class="s" style="text-anchor:middle;font-weight:600">OpenAI 页的组成</text>
<text x="1005" y="28" class="s" style="text-anchor:middle;font-weight:600">写在哪里</text>

<rect x="40" y="44" width="660" height="124" rx="10" fill="#fefce8" stroke="#ca8a04"/>
<text x="60" y="76" class="h">① OpenAI · Model choices</text>
<text x="60" y="108" class="t">Use an OpenAI embedding model with <tspan font-weight="600" fill="#a16207">{{var.product_name}}</tspan> …</text>
<text x="60" y="140" class="t">模型表与说明</text>
<path class="link" d="M700 106 H770"/>
<rect x="770" y="44" width="470" height="124" rx="10" fill="#ffffff" stroke="#ca8a04"/>
<text x="790" y="76" class="h">共享正文，整篇复用</text>
<text x="790" y="108" class="t">milvus-docs 原文</text>
<text x="790" y="140" class="t">产品名写成变量，两端分别绑定</text>

<rect x="40" y="188" width="660" height="140" rx="10" fill="#ffedd5" stroke="#c2410c"/>
<text x="60" y="220" class="h">② Before you start</text>
<text x="60" y="254" class="t">Milvus：Configure credentials（配置 milvus.yaml）</text>
<text x="60" y="286" class="t">Cloud：在控制台创建 OpenAI 集成，获取 integration ID</text>
<text x="60" y="314" class="s">两端整节不同</text>
<path class="link" d="M700 258 H770"/>
<rect x="770" y="188" width="470" height="140" rx="10" fill="#ffffff" stroke="#c2410c"/>
<text x="790" y="220" class="h">整节替换</text>
<text x="790" y="254" class="t">milvus-docs：给这一节加命名块（block ID）</text>
<text x="790" y="286" class="t">zdoc：页面配置写 replace，</text>
<text x="790" y="312" class="t">Cloud 的内容放在片段中</text>

<rect x="40" y="348" width="1200" height="470" rx="10" fill="#ffffff" stroke="#1d4ed8"/>
<text x="60" y="382" class="h">③ Define the text embedding function · 代码中的凭证参数</text>

<text x="60" y="420" class="s" style="font-weight:600">milvus-docs 原文（共享代码）</text>
<rect x="60" y="432" width="520" height="210" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="78" y="462" class="code">params={</text>
<text x="78" y="486" class="code">    "provider": "openai",</text>
<rect x="66" y="496" width="508" height="104" rx="4" fill="#dbeafe"/>
<text x="78" y="518" class="cmt">    # include-next-line zilliz</text>
<text x="78" y="542" class="code">    "integration_id": "YOUR_INTEGRATION_ID",</text>
<text x="78" y="566" class="cmt">    # include-next-line milvus</text>
<text x="78" y="590" class="code">    # "credential": "apikey_dev",</text>
<text x="78" y="624" class="code">}</text>

<path class="edge" d="M580 500 H650 V490 H703"/>
<text x="598" y="474" class="s">Milvus 发布</text>
<path class="edge" d="M580 580 H650 V654 H703"/>
<text x="598" y="684" class="s">Cloud 生成</text>

<text x="710" y="420" class="s" style="font-weight:600">Milvus 站点</text>
<rect x="710" y="432" width="510" height="120" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="728" y="462" class="code">params={</text>
<text x="728" y="486" class="code">    "provider": "openai",</text>
<text x="728" y="510" class="code">    # "credential": "apikey_dev",</text>
<text x="728" y="534" class="code">}</text>

<text x="710" y="582" class="s" style="font-weight:600">Cloud 站点</text>
<rect x="710" y="594" width="510" height="120" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="728" y="624" class="code">params={</text>
<text x="728" y="648" class="code">    "provider": "openai",</text>
<text x="728" y="672" class="code">    "integration_id": "YOUR_INTEGRATION_ID",</text>
<text x="728" y="696" class="code">}</text>

<text x="60" y="756" class="t">两行都写在 milvus-docs 的共享代码中；发布时各自删去不适用的一行和指令，读者只看到自己的一行。</text>
<text x="60" y="788" class="s">Milvus 的 credential 是可选提示（key 已在 milvus.yaml 中配置）；Cloud 的 integration_id 必填。指令语法沿用 zdoc 代码变体规范。</text>

<rect x="40" y="832" width="16" height="16" rx="3" fill="#fefce8" stroke="#ca8a04"/><text x="64" y="846" class="s">来自共享原文</text>
<rect x="190" y="832" width="16" height="16" rx="3" fill="#ffedd5" stroke="#c2410c"/><text x="214" y="846" class="s">两端整节不同，Cloud 用片段替换</text>
<rect x="470" y="832" width="16" height="16" rx="3" fill="#dbeafe"/><text x="494" y="846" class="s">产品行指令标记的代码行</text>
</svg>
