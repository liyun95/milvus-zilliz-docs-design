<svg xmlns="http://www.w3.org/2000/svg" width="768" height="480" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
<title id="title">一个共享页面涉及哪些文件</title>
<desc id="desc">以 OpenAI 页为例。milvus-docs 中有两类文件：每页一份的共享原文，包含正文、变量和命名块；共用的 Milvus 默认变量。zdoc 的 shared-docs 目录中，决定页面内容的有五类：每页一份的页面配置，说明引用哪篇、发布到哪些手册、做哪些变换；按需提供的 Cloud 内容文件；共用的 Cloud 变量；共用的链接映射表；工程维护的代码 Tabs 规则。决定用哪个版本的有两类：每页一份、由工具写入的 lock.yaml，记录 Prod 与 UAT 各用共享原文的哪个 commit；工程维护的 source.yaml，记录从哪个仓库和分支发现新提交。生成的 Cloud 页面中，标题、描述、标签与路由来自页面配置，导航 Phase 1 仍来自飞书目录；正文来自共享原文，绑定 Cloud 变量，链接按映射表对应；Before you start 一节来自 Cloud 内容文件，由页面配置的 replace 指定；代码 Tabs 来自共享原文的代码，凭证参数行按页面配置中的规则替换，再按 Tabs 规则生成，原文有哪些语言就显示哪些。写作者日常只改共享原文、页面配置和 Cloud 内容文件。</desc>
<defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#374151;}.grp{font-size:18px;font-weight:600;}.file{font-family:'SF Mono',Menlo,Consolas,monospace;font-size:14px;fill:#1f2937;}.d{font-size:14px;fill:#64748b;}.num{font-size:14px;font-weight:600;fill:#ffffff;text-anchor:middle;}.chip{font-size:13px;font-weight:600;text-anchor:middle;}.sec{font-size:17px;font-weight:600;}.from{font-size:14px;fill:#475569;}.note{font-size:15px;fill:#475569;}</style></defs>
<rect width="1280" height="640" fill="#ffffff"/>

<text x="40" y="28" class="d" style="font-weight:600">一个共享页的文件（以 OpenAI 页为例）</text>
<text x="770" y="28" class="d" style="font-weight:600">生成的 Cloud 页面</text>

<rect x="40" y="40" width="640" height="150" rx="12" fill="#ffffff" stroke="#b45309"/>
<text x="60" y="68" class="grp">milvus-docs</text>
<g>
<circle cx="74" cy="100" r="12" fill="#b45309"/><text x="74" y="105" class="num">1</text>
<text x="96" y="98" class="file">site/en/userGuide/…/openai.md</text>
<text x="96" y="120" class="d">共享原文：正文、变量、命名块</text>
<rect x="584" y="88" width="80" height="24" rx="12" fill="#fef3c7" stroke="#b45309"/><text x="624" y="105" class="chip" style="fill:#92400e">每页一份</text>
</g>
<g>
<circle cx="74" cy="152" r="12" fill="#b45309"/><text x="74" y="157" class="num">2</text>
<text x="96" y="150" class="file">site/en/Variables.json</text>
<text x="96" y="172" class="d">Milvus 的默认值</text>
<rect x="584" y="140" width="80" height="24" rx="12" fill="#f1f5f9" stroke="#94a3b8"/><text x="624" y="157" class="chip" style="fill:#475569">共用</text>
</g>

<rect x="40" y="206" width="640" height="320" rx="12" fill="#ffffff" stroke="#6d28d9"/>
<text x="60" y="234" class="grp">zdoc · shared-docs/</text><text x="250" y="234" class="d">决定页面内容</text>
<g>
<circle cx="74" cy="266" r="12" fill="#6d28d9"/><text x="74" y="271" class="num">3</text>
<text x="96" y="264" class="file">pages/openai/page.yaml</text>
<text x="96" y="286" class="d">引用哪篇、发布到哪些手册、做哪些变换</text>
<rect x="584" y="254" width="80" height="24" rx="12" fill="#fef3c7" stroke="#b45309"/><text x="624" y="271" class="chip" style="fill:#92400e">每页一份</text>
</g>
<g>
<circle cx="74" cy="318" r="12" fill="#6d28d9"/><text x="74" y="323" class="num">4</text>
<text x="96" y="316" class="file">pages/openai/before-you-start.md</text>
<text x="96" y="338" class="d">Cloud 内容文件：用来替换或新增的内容</text>
<rect x="584" y="306" width="80" height="24" rx="12" fill="#fef3c7" stroke="#b45309"/><text x="624" y="323" class="chip" style="fill:#92400e">按需</text>
</g>
<g>
<circle cx="74" cy="370" r="12" fill="#6d28d9"/><text x="74" y="375" class="num">5</text>
<text x="96" y="368" class="file">Variables.json</text>
<text x="96" y="390" class="d">Cloud 的产品值</text>
<rect x="584" y="358" width="80" height="24" rx="12" fill="#f1f5f9" stroke="#94a3b8"/><text x="624" y="375" class="chip" style="fill:#475569">共用</text>
</g>
<g>
<circle cx="74" cy="422" r="12" fill="#6d28d9"/><text x="74" y="427" class="num">6</text>
<text x="96" y="420" class="file">links.yaml</text>
<text x="96" y="442" class="d">Milvus 页面到 Cloud 页面的链接映射</text>
<rect x="584" y="410" width="80" height="24" rx="12" fill="#f1f5f9" stroke="#94a3b8"/><text x="624" y="427" class="chip" style="fill:#475569">共用</text>
</g>
<g>
<circle cx="74" cy="474" r="12" fill="#6d28d9"/><text x="74" y="479" class="num">7</text>
<text x="96" y="472" class="file">presentation/cloud-sdk-tabs.yaml</text>
<text x="96" y="494" class="d">代码 Tabs 的顺序、显示名与必须有的语言</text>
<rect x="584" y="462" width="80" height="24" rx="12" fill="#f1f5f9" stroke="#94a3b8"/><text x="624" y="479" class="chip" style="fill:#475569">工程维护</text>
</g>

<rect x="40" y="542" width="640" height="150" rx="12" fill="#ffffff" stroke="#0f766e"/>
<text x="60" y="570" class="grp">zdoc · shared-docs/</text><text x="250" y="570" class="d">决定用哪个版本，不提供内容</text>
<g>
<circle cx="74" cy="602" r="12" fill="#0f766e"/><text x="74" y="607" class="num">8</text>
<text x="96" y="600" class="file">pages/openai/lock.yaml</text>
<text x="96" y="622" class="d">Prod 与 UAT 各用 ① 的哪个 commit</text>
<rect x="584" y="590" width="80" height="24" rx="12" fill="#ccfbf1" stroke="#0f766e"/><text x="624" y="607" class="chip" style="fill:#115e59">工具写入</text>
</g>
<g>
<circle cx="74" cy="654" r="12" fill="#0f766e"/><text x="74" y="659" class="num">9</text>
<text x="96" y="652" class="file">source.yaml</text>
<text x="96" y="674" class="d">从哪个仓库、哪个分支发现新提交</text>
<rect x="584" y="642" width="80" height="24" rx="12" fill="#f1f5f9" stroke="#94a3b8"/><text x="624" y="659" class="chip" style="fill:#475569">工程维护</text>
</g>

<path d="M700 280 H740" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
<path d="M732 272 L742 280 L732 288" fill="none" stroke="#94a3b8" stroke-width="2"/>

<rect x="760" y="40" width="480" height="652" rx="12" fill="#ffffff" stroke="#64748b"/>
<rect x="780" y="58" width="440" height="72" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="796" y="86" class="sec">front matter</text>
<text x="796" y="112" class="from">标题、描述、标签、路由 ← ③；导航 ← 飞书目录</text>

<rect x="780" y="144" width="440" height="88" rx="8" fill="#fefce8" stroke="#ca8a04"/>
<text x="796" y="172" class="sec">OpenAI · Model choices</text>
<text x="796" y="198" class="from">正文 ← ①，产品名绑定 ⑤，链接按 ⑥ 对应</text>
<text x="796" y="220" class="from" style="fill:#94a3b8">“… with Zilliz Cloud”</text>

<rect x="780" y="246" width="440" height="88" rx="8" fill="#ffedd5" stroke="#c2410c"/>
<text x="796" y="274" class="sec">Before you start</text>
<text x="796" y="300" class="from">内容 ← ④</text>
<text x="796" y="322" class="from">由 ③ 中的 replace 指定替换 ① 的哪一节</text>

<rect x="780" y="348" width="440" height="160" rx="8" fill="#fefce8" stroke="#ca8a04"/>
<text x="796" y="376" class="sec">Define the text embedding function</text>
<text x="796" y="402" class="from">代码 ← ① 中的各语言代码</text>
<text x="796" y="426" class="from">凭证参数行按 ③ 中的规则替换</text>
<text x="796" y="450" class="from">按 ⑦ 生成多语言 Tabs</text>
<rect x="796" y="466" width="300" height="26" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
<text x="808" y="484" class="from" style="font-size:13px">Python | Java | Go | NodeJS | cURL</text><text x="1106" y="484" class="from" style="font-size:12px;fill:#94a3b8">原文有哪些</text><text x="1106" y="500" class="from" style="font-size:12px;fill:#94a3b8">就显示哪些</text>

<rect x="780" y="542" width="440" height="132" rx="8" fill="#f0fdfa" stroke="#0f766e"/>
<text x="796" y="570" class="sec">用哪个版本的 ①</text>
<text x="796" y="598" class="from">Prod 用 ⑧ 中的 current，UAT 用 ⑧ 中的 next</text>
<text x="796" y="624" class="from">新提交从 ⑨ 的跟踪分支发现</text>
<text x="796" y="650" class="from" style="fill:#94a3b8">两者相同时，Prod 与 UAT 显示同样的内容</text>

<text x="40" y="736" class="note">写作者日常只改 ①、③、④：共同内容改 ①，Cloud 的差异改 ③ 和 ④。</text>
<text x="40" y="764" class="note">②、⑤ 新增变量时才改；⑥ 链接查不到 Cloud 对应页时补一行；⑦、⑨ 由工程维护；⑧ 由工具写入，人不手改。</text>
</svg>
