<svg xmlns="http://www.w3.org/2000/svg" width="768" height="540" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
<title id="title">目标工具链：共享内容生成与 Cloud 独有文档的接入路径</title>
<desc id="desc">Milvus 沿用既有发布链。zdoc 新增共享源获取和候选生成，复用 md2md 变量与 include 实现并为其增加独立预处理入口；Cloud 配置包括页面 YAML 和共用 Variables.json；差异内容以 Markdown 或代码片段提供。组装输出 Markdown/MDX 候选。右侧沿用常规内容流程并扩展 Git 输入。无共享引用的 Cloud 独有页以完整 Markdown/MDX 原文进入常规流程，批量迁移安排在后续。独立章节编排不属于首期。</desc>
