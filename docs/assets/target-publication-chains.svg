<svg xmlns="http://www.w3.org/2000/svg" width="768" height="540" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
<title id="title">目标工具链：zdoc 前端新增共享接入，后端沿用现有发布流程</title>
<desc id="desc">Milvus 沿用 milvus-docs、md2md、web-content、milvus.io 的发布链，md2md 新增预处理入口和代码行过滤。zdoc 在 md2md 处理之前直接读取 milvus-docs 的固定版本原文，结合页面配置、Variables.json 和 Cloud 内容文件生成 Cloud 页面，这部分是新增工作。生成结果以升级 PR 审核合并后，进入 zdoc 既有的校验、过滤、Current/Next、翻译与发布流程。过渡期未迁移的飞书页继续经 Fetch 进入，Cloud 独有页后续以 Git 原文直接接入。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#374151;}.head{font-size:20px;font-weight:600;text-anchor:middle;}.sub{font-size:17px;text-anchor:middle;fill:#64748b;}.lbl{font-size:17px;text-anchor:middle;fill:#475569;}.new{font-size:17px;font-weight:600;text-anchor:middle;fill:#c2410c;}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow);}.weak{fill:none;stroke:#94a3b8;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#arrow);}</style></defs>
