<svg xmlns="http://www.w3.org/2000/svg" width="768" height="444" viewBox="0 0 1280 740" role="img" aria-labelledby="title desc">
<title id="title">Cloud 页面生成流水线</title>
<desc id="desc">Cloud 侧按六步生成页面，current 与 next 两个版本各执行一遍：按 lock 中的 commit 获取 milvus-docs 原文；在原文中定位命名块与代码组；按页面配置对命名块、语言示例或代码中连续的几行执行 add、replace、remove；调用 md2md 新的预处理入口，用 Cloud 的 Variables.json 展开变量与片段；沿用 zdoc 现有的产品过滤，处理 Cloud 内容文件中的产品指令，共享原文不含产品指令；最后做站点适配，生成多语言 Tabs、链接与图片映射和 front matter，然后按块比较两个版本，把不同的块成对包进 NextChannel，输出一份 MDX 候选页面与依赖记录，交给上游更新 PR。命名块在变量展开之前定位，Cloud 内容与原文一起展开变量。Milvus 侧沿用 md2md 发布，用 Milvus 变量展开并清除命名块标记。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#374151;}.head{font-size:20px;font-weight:600;text-anchor:middle;}.sub{font-size:16px;text-anchor:middle;fill:#64748b;}.num{font-size:15px;font-weight:600;text-anchor:middle;fill:#ffffff;}.chip{font-size:14px;font-weight:600;text-anchor:middle;}.note{font-size:15px;fill:#475569;}.lane{font-size:18px;font-weight:600;fill:#374151;}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow);}</style></defs>
<rect width="1280" height="740" fill="#ffffff"/>

<rect x="40" y="20" width="250" height="70" rx="10" fill="#fef3c7" stroke="#b45309"/>
<text x="165" y="50" class="head" style="font-size:18px">milvus-docs 原文</text><text x="165" y="74" class="sub">current · next 两个 commit</text>
<rect x="452" y="20" width="250" height="70" rx="10" fill="#fef3c7" stroke="#b45309"/>
<text x="577" y="50" class="head" style="font-size:18px">页面配置 · Cloud 内容文件</text><text x="577" y="74" class="sub">zdoc overlay</text>
<rect x="658" y="20" width="0" height="0"/>
<rect x="720" y="20" width="200" height="70" rx="10" fill="#fef3c7" stroke="#b45309"/>
<text x="820" y="50" class="head" style="font-size:18px">Variables.json</text><text x="820" y="74" class="sub">Cloud 产品值</text>

<path class="edge" d="M165 90 V143"/>
<path class="edge" d="M577 90 V143"/>
<path class="edge" d="M820 90 V143"/>

<g>
<rect x="40" y="150" width="180" height="120" rx="10" fill="#ddd6fe" stroke="#6d28d9"/>
<circle cx="64" cy="174" r="13" fill="#6d28d9"/><text x="64" y="179" class="num">1</text>
<text x="138" y="182" class="head">获取</text><text x="130" y="216" class="sub">按 lock 读取</text><text x="130" y="240" class="sub">current 与 next</text>
</g>
<g>
<rect x="244" y="150" width="180" height="120" rx="10" fill="#ddd6fe" stroke="#6d28d9"/>
<circle cx="268" cy="174" r="13" fill="#6d28d9"/><text x="268" y="179" class="num">2</text>
<text x="342" y="182" class="head">定位</text><text x="334" y="216" class="sub">命名块与代码组</text><text x="334" y="240" class="sub">生成命名块清单</text>
</g>
<g>
<rect x="448" y="150" width="180" height="120" rx="10" fill="#ddd6fe" stroke="#6d28d9"/>
<circle cx="472" cy="174" r="13" fill="#6d28d9"/><text x="472" y="179" class="num">3</text>
<text x="546" y="182" class="head">组装</text><text x="538" y="216" class="sub">块 · 语言 · 行的变换</text><text x="538" y="240" class="sub">两个版本都执行</text>
</g>
<g>
<rect x="652" y="150" width="180" height="120" rx="10" fill="#ddd6fe" stroke="#6d28d9"/>
<circle cx="676" cy="174" r="13" fill="#6d28d9"/><text x="676" y="179" class="num">4</text>
<text x="750" y="182" class="head">展开</text><text x="742" y="216" class="sub">变量与片段 include</text><text x="742" y="240" class="sub">报告实际依赖</text>
</g>
<g>
<rect x="856" y="150" width="180" height="120" rx="10" fill="#ddd6fe" stroke="#6d28d9"/>
<circle cx="880" cy="174" r="13" fill="#6d28d9"/><text x="880" y="179" class="num">5</text>
<text x="954" y="182" class="head">过滤</text><text x="946" y="216" class="sub">沿用产品过滤</text><text x="946" y="240" class="sub">只处理 Cloud 内容</text>
</g>
<g>
<rect x="1060" y="150" width="180" height="120" rx="10" fill="#ddd6fe" stroke="#6d28d9"/>
<circle cx="1084" cy="174" r="13" fill="#6d28d9"/><text x="1084" y="179" class="num">6</text>
<text x="1158" y="182" class="head">适配</text><text x="1150" y="216" class="sub">Tabs · 链接 · 图片</text><text x="1150" y="240" class="sub">front matter → MDX</text>
</g>
<path class="edge" d="M220 210 H237"/><path class="edge" d="M424 210 H441"/><path class="edge" d="M628 210 H645"/><path class="edge" d="M832 210 H849"/><path class="edge" d="M1036 210 H1053"/>

<rect x="52" y="282" width="360" height="28" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-dasharray="5 4"/><text x="232" y="301" class="chip" style="fill:#c2410c">zdoc 新增</text>
<rect x="460" y="282" width="156" height="28" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-dasharray="5 4"/><text x="538" y="301" class="chip" style="fill:#c2410c">zdoc 新增</text>
<rect x="664" y="282" width="156" height="28" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-dasharray="5 4"/><text x="742" y="301" class="chip" style="fill:#c2410c">md2md 新入口</text>
<rect x="868" y="282" width="156" height="28" rx="14" fill="#f1f5f9" stroke="#64748b"/><text x="946" y="301" class="chip" style="fill:#475569">zdoc 现有过滤器</text>
<rect x="1072" y="282" width="156" height="28" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-dasharray="5 4"/><text x="1150" y="301" class="chip" style="fill:#c2410c">zdoc 新增</text>

<path class="edge" d="M1150 310 V333"/>
<rect x="980" y="340" width="260" height="96" rx="10" fill="#ddd6fe" stroke="#6d28d9"/>
<text x="1110" y="368" class="head" style="font-size:18px">通道合并</text><text x="1110" y="396" class="sub">按块比较两个版本</text><text x="1110" y="420" class="sub">不同的块成对包进 NextChannel</text>
<path class="edge" d="M1110 436 V455"/>
<rect x="980" y="462" width="260" height="98" rx="10" fill="#ffffff" stroke="#64748b"/>
<text x="1110" y="490" class="head" style="font-size:18px">Cloud 候选页面</text><text x="1110" y="516" class="sub">MDX + lock + 依赖记录</text><text x="1110" y="542" class="sub">交给上游更新 PR</text>

<text x="52" y="350" class="note">· 第 2 步在变量展开之前：命名块标记仍在原文中，才能可靠定位。</text>
<text x="52" y="378" class="note">· 第 3 步插入的 Cloud 内容与原文一起在第 4 步展开变量；缺少 Cloud 绑定直接失败。</text>
<text x="52" y="406" class="note">· 第 4 步只调用 md2md 的预处理，不运行 Milvus 站点插件。</text>
<text x="52" y="434" class="note">· 第 5 步沿用 zdoc 现有的产品过滤（如 saas / paas）；共享原文不写产品指令。</text>
<text x="52" y="462" class="note">· 第 1–6 步对 current 与 next 各执行一遍，Cloud 规则在两个版本上都必须成立；版本相同时不产生通道标记。</text>

<path d="M20 570 H1260" stroke="#e2e8f0" stroke-width="2"/>
<text x="40" y="608" class="lane">Milvus 侧（对照）</text>
<rect x="40" y="626" width="230" height="84" rx="10" fill="#fef3c7" stroke="#b45309"/>
<text x="155" y="660" class="head" style="font-size:18px">milvus-docs 原文</text><text x="155" y="688" class="sub">同一份</text>
<path class="edge" d="M270 668 H323"/>
<rect x="330" y="626" width="560" height="84" rx="10" fill="#ddd6fe" stroke="#6d28d9"/>
<text x="610" y="660" class="head" style="font-size:18px">md2md（goover）</text><text x="610" y="688" class="sub">Milvus 变量 · 清除命名块标记（新增）</text>
<path class="edge" d="M890 668 H943"/>
<rect x="950" y="626" width="290" height="84" rx="10" fill="#fef3c7" stroke="#b45309"/>
<text x="1095" y="660" class="head" style="font-size:18px">web-content</text><text x="1095" y="688" class="sub">既有 Milvus 发布</text>
</svg>
