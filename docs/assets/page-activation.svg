<svg xmlns="http://www.w3.org/2000/svg" width="855" height="280" viewBox="0 0 1710 560" role="img" aria-labelledby="title desc">
<title id="title">一页从飞书切换到 Git（激活）</title>
<desc id="desc">文档负责人分三步激活一页。比较：在 GitHub Actions 中运行，生成 Git 版与网站当前飞书版的差异，并检查能否生成、链接与图片能否解析、表格记录与页面配置是否一致，不改网站。确认：由人判断飞书最近的修改已在 Git 中，或飞书已暂时冻结。激活：在飞书表格中把 Docs 链接换成 Git 中的页面目录。下一次 Fetch 在同一个提交中写入正文、导航与 active.json，网站上换成 Git 版，飞书不能再改这一页，导航仍由飞书表格决定；Fetch 检查不通过时保留网站现有的版本并通知。比较或确认不通过时不激活，修正后重新比较。接入之后才能激活，一页只激活一次，不提供切回飞书。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#374151;}.lane{font-size:19px;font-weight:600;}.band{font-size:17px;font-weight:600;text-anchor:middle;}.head{font-size:20px;font-weight:600;}.t{font-size:16px;fill:#475569;}.note{font-size:15px;fill:#64748b;}.warn{font-size:15px;fill:#b45309;text-anchor:middle;}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow);}.loop{fill:none;stroke:#d97706;stroke-width:1.8;stroke-dasharray:6 5;}</style></defs>
<rect width="1710" height="560" fill="#ffffff"/>

<text x="40" y="78" class="lane">网站上的这一页</text>
<rect x="230" y="48" width="1040" height="48" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="750" y="79" class="band" style="fill:#475569">飞书版：飞书仍是正式来源</text>
<rect x="1340" y="48" width="340" height="48" rx="10" fill="#fef3c7" stroke="#d97706"/>
<text x="1510" y="79" class="band" style="fill:#92400e">Git 版</text>

<text x="40" y="236" class="lane">文档负责人</text>

<rect x="230" y="140" width="300" height="190" rx="12" fill="#ffffff" stroke="#64748b"/>
<text x="252" y="180" class="head">① 比较</text>
<text x="252" y="216" class="t">GitHub Actions 中运行：</text>
<text x="252" y="242" class="t">生成与飞书版的差异，</text>
<text x="252" y="268" class="t">并做激活前的检查</text>
<text x="252" y="308" class="note">不改网站</text>

<rect x="600" y="140" width="300" height="190" rx="12" fill="#ffffff" stroke="#64748b"/>
<text x="622" y="180" class="head">② 确认</text>
<text x="622" y="220" class="t">飞书最近的修改已在 Git 中，</text>
<text x="622" y="246" class="t">或飞书已暂时冻结</text>
<text x="622" y="308" class="note">由人判断，工具不检查</text>

<rect x="970" y="140" width="300" height="190" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="992" y="180" class="head">③ 激活</text>
<text x="992" y="220" class="t">在飞书表格中把</text>
<text x="992" y="246" class="t">Docs 换成 Git 页面目录</text>
<text x="992" y="308" class="note">下一次 Fetch 生效</text>

<rect x="1340" y="140" width="340" height="190" rx="12" fill="#ffffff" stroke="#64748b"/>
<text x="1362" y="180" class="head">已切换</text>
<text x="1362" y="216" class="t">正文、导航与 active.json</text>
<text x="1362" y="242" class="t">在同一个提交中写入</text>
<text x="1362" y="268" class="t">飞书不能再改这一页</text>
<text x="1362" y="308" class="note">检查不通过：保留现有版本并通知</text>

<path class="edge" d="M530 235 H593"/>
<path class="edge" d="M900 235 H963"/>
<path class="edge" d="M1270 235 H1333"/>

<path class="loop" d="M750 330 V400 H380 V338" marker-end="url(#arrow)"/>
<text x="750" y="438" class="warn">比较时检查不通过，或确认不通过（飞书的修改还没同步到 Git）：</text>
<text x="750" y="462" class="warn">不激活，网站保持飞书版；修正后重新比较</text>

<text x="40" y="530" class="note">接入之后才能激活；全新的页面在表格中直接填 Git 页面目录；一页只激活一次；不提供切回飞书。</text>
</svg>
