<svg xmlns="http://www.w3.org/2000/svg" width="768" height="252" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
<title id="title">三类页面：无差异、有差异、Cloud 独有</title>
<desc id="desc">无差异的页面整篇复用，例如 Delete Entities：原文中产品值写成变量，zdoc 只需一份页面配置。有差异的页面在共享正文上叠加 Cloud 差异，例如 OpenAI 和 Filtered Search：原文只加命名块，zdoc 维护页面配置和 Cloud 内容文件，代码中个别行的差异也写在页面配置中。Cloud 独有的页面不引用共享内容，在 zdoc 维护完整原文，首期不迁移。从左到右，Cloud 需要维护的内容越来越多。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#94a3b8"/></marker>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#374151;}.head{font-size:21px;font-weight:600;}.item{font-size:17px;fill:#475569;}.chip{font-size:15px;font-weight:600;text-anchor:middle;}.axis{font-size:15px;fill:#64748b;}</style></defs>
<rect width="1280" height="420" fill="#ffffff"/>

<path d="M40 28 H1232" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="20" class="axis">Cloud 需要维护的内容：少</text>
<text x="1240" y="20" class="axis" style="text-anchor:end">多</text>

<rect x="40" y="48" width="380" height="350" rx="14" fill="#ffffff" stroke="#64748b"/>
<text x="64" y="88" class="head">无差异：整篇复用</text>
<rect x="64" y="104" width="150" height="30" rx="15" fill="#fef3c7" stroke="#b45309"/><text x="139" y="125" class="chip" style="fill:#92400e">Delete Entities</text>
<rect x="64" y="152" width="120" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="76" y="166" width="96" height="28" rx="4" fill="#fefce8" stroke="#ca8a04"/>
<rect x="76" y="202" width="96" height="40" rx="4" fill="#fefce8" stroke="#ca8a04"/>
<rect x="76" y="250" width="96" height="40" rx="4" fill="#fefce8" stroke="#ca8a04"/>
<text x="204" y="190" class="item">全部来自共享原文</text>
<text x="204" y="222" class="item">产品值用变量绑定</text>
<text x="64" y="340" class="item">原文：产品值写成变量</text>
<text x="64" y="372" class="item">zdoc：一份页面配置</text>

<rect x="450" y="48" width="380" height="350" rx="14" fill="#ffffff" stroke="#64748b"/>
<text x="474" y="88" class="head">有差异：共享 + Cloud 差异</text>
<rect x="474" y="104" width="250" height="30" rx="15" fill="#fef3c7" stroke="#b45309"/><text x="599" y="125" class="chip" style="fill:#92400e">OpenAI · Filtered Search</text>
<rect x="474" y="152" width="120" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="486" y="166" width="96" height="28" rx="4" fill="#fefce8" stroke="#ca8a04"/>
<rect x="486" y="202" width="96" height="40" rx="4" fill="#ffedd5" stroke="#c2410c"/>
<rect x="486" y="250" width="96" height="40" rx="4" fill="#fefce8" stroke="#ca8a04"/>
<rect x="492" y="266" width="84" height="10" rx="2" fill="#93c5fd"/>
<text x="614" y="190" class="item">大部分共享</text>
<text x="614" y="222" class="item">个别节由 Cloud 替换</text>
<text x="614" y="276" class="item">代码中个别行不同</text>
<text x="474" y="340" class="item">原文：只加命名块</text>
<text x="474" y="372" class="item">zdoc：页面配置 + Cloud 内容文件</text>

<rect x="860" y="48" width="380" height="350" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="7 5"/>
<text x="884" y="88" class="head">Cloud 独有</text>
<rect x="884" y="104" width="130" height="30" rx="15" fill="#f1f5f9" stroke="#94a3b8"/><text x="949" y="125" class="chip" style="fill:#475569">首期不迁移</text>
<rect x="884" y="152" width="120" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="896" y="166" width="96" height="28" rx="4" fill="#ffedd5" stroke="#c2410c"/>
<rect x="896" y="202" width="96" height="40" rx="4" fill="#ffedd5" stroke="#c2410c"/>
<rect x="896" y="250" width="96" height="40" rx="4" fill="#ffedd5" stroke="#c2410c"/>
<text x="1024" y="190" class="item">全部是 Cloud 内容</text>
<text x="1024" y="222" class="item">不引用共享原文</text>
<text x="884" y="340" class="item">原文：无</text>
<text x="884" y="372" class="item">zdoc：完整 Markdown / MDX</text>
</svg>
