<svg xmlns="http://www.w3.org/2000/svg" width="768" height="228" viewBox="0 0 1280 380" role="img" aria-labelledby="title desc">
<title id="title">日常维护：修改源内容，审核生成结果</title>
<desc id="desc">从左到右：作者修改 milvus-docs 共同内容或 zdoc 的 Cloud 内容与配置；工具生成候选页面和变更提示；人工检查适用性与完整性；确认采用版本后按既有节奏安排发布，并非立即上线。需要修改时返回对应源内容。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#374151;}.head{font-size:22px;font-weight:600;text-anchor:middle;}.sub{font-size:18px;fill:#64748b;text-anchor:middle;}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow);}</style></defs>
<rect width="1280" height="380" fill="#ffffff"/>
<text x="172" y="42" class="head">1 修改源内容</text>
<text x="495" y="42" class="head">2 工具生成</text>
<text x="812" y="42" class="head">3 人工审核</text>
<text x="1122" y="42" class="head">4 采用与发布</text>
<rect x="15" y="70" width="315" height="225" rx="14" fill="#ffffff" stroke="#64748b"/>
<rect x="35" y="90" width="275" height="80" rx="10" fill="#fef3c7" stroke="#b45309"/>
<text x="172" y="123" class="head">milvus-docs</text><text x="172" y="153" class="sub">共同内容</text>
<rect x="35" y="195" width="275" height="80" rx="10" fill="#fef3c7" stroke="#b45309"/>
<text x="172" y="228" class="head">zdoc</text><text x="172" y="258" class="sub">Cloud 内容与配置</text>
<path class="edge" d="M330 182 H358"/>
<rect x="365" y="130" width="260" height="105" rx="10" fill="#ddd6fe" stroke="#6d28d9"/>
<text x="495" y="170" class="head">候选页面与预览</text><text x="495" y="206" class="sub">提示受影响页面与变化</text>
<path class="edge" d="M625 182 H683"/>
<rect x="690" y="130" width="245" height="105" rx="10" fill="#93c5fd" stroke="#1e3a5f"/>
<text x="812" y="170" class="head">文档工程师 / 审核人</text><text x="812" y="206" class="sub">检查适用性与完整性</text>
<path class="edge" d="M935 182 H993"/>
<rect x="1000" y="130" width="245" height="105" rx="10" fill="#ffffff" stroke="#64748b"/>
<text x="1122" y="170" class="head">确认采用版本</text><text x="1122" y="206" class="sub">按既有节奏安排发布</text>
<path class="edge" d="M812 235 V340 H172 V302"/>
<text x="492" y="327" class="sub">需要修改：回到对应源内容</text>
</svg>
