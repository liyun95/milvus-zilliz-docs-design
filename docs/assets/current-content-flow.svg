<svg xmlns="http://www.w3.org/2000/svg" width="768" height="486" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">共享正文的三条维护路径</title>
  <desc id="desc">Cloud 侧的飞书正文、共同维护角色中的文档工程师、Milvus 侧的 milvus-docs 正文纵向排列。①工程师编辑飞书、导出后提交 PR；②工程师或社区贡献者直接提交 PR；③工程师核对共享变更，再手动编辑飞书。两份正文均可独立编辑。虚线表示需另行人工跟进。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #374151; }
      .label { font-size: 24px; text-anchor: middle; font-weight: 600; }
      .note { font-size: 18px; fill: #64748b; }
      .action { font-size: 20px; fill: #374151; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2.3; marker-end: url(#arrow); }
      .badge { font-size: 17px; fill: #b45309; font-weight: 600; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <rect x="15" y="20" width="1170" height="200" rx="16" fill="#ffffff" stroke="#64748b"/>
  <rect x="15" y="245" width="1170" height="200" rx="16" fill="#ffffff" stroke="#64748b"/>
  <rect x="15" y="470" width="1170" height="220" rx="16" fill="#ffffff" stroke="#64748b"/>
  <path d="M175 20 V220 M175 245 V445 M175 470 V690" stroke="#64748b"/>
  <text x="95" y="128" class="label">Cloud 侧</text>
  <text x="95" y="338" class="label">共同维护</text>
  <text x="95" y="373" class="label">角色</text>
  <text x="95" y="588" class="label">Milvus 侧</text>

  <rect x="410" y="55" width="320" height="100" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="570" y="95" class="label">飞书正文</text>
  <text x="570" y="130" class="note" text-anchor="middle">用于 Cloud 文档发布</text>
  <rect x="635" y="40" width="138" height="30" rx="15" fill="#fef3c7" stroke="#b45309"/>
  <text x="704" y="61" class="badge">可独立编辑</text>

  <rect x="410" y="290" width="320" height="100" rx="14" fill="#93c5fd" stroke="#1e3a5f" stroke-width="1.8"/>
  <text x="570" y="331" class="label">文档工程师</text>
  <text x="570" y="366" class="note" text-anchor="middle">参与两侧内容维护</text>

  <a href="https://github.com/milvus-io/milvus-docs">
    <rect x="410" y="565" width="320" height="100" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
    <text x="570" y="605" class="label">milvus-docs 正文</text>
    <text x="570" y="640" class="note" text-anchor="middle">用于 Milvus 文档发布</text>
  </a>
  <rect x="635" y="550" width="138" height="30" rx="15" fill="#fef3c7" stroke="#b45309"/>
  <text x="704" y="571" class="badge">可独立编辑</text>
  <rect x="930" y="582" width="225" height="68" rx="14" fill="#a7f3d0" stroke="#047857" stroke-width="1.8"/>
  <text x="1042" y="624" class="label">社区贡献者</text>

  <path class="edge" d="M465 155 V285"/>
  <text x="448" y="205" class="action" text-anchor="end">① 导出</text>
  <path class="edge" d="M585 290 V160"/>
  <text x="603" y="205" class="action">①③ 编辑</text>
  <path class="edge" d="M465 390 V560"/>
  <text x="448" y="508" class="action" text-anchor="end">①② 提交 PR</text>
  <path class="edge" d="M585 565 V395" stroke-dasharray="7 6"/>
  <text x="603" y="508" class="action">③ 核对共享变更</text>
  <path class="edge" d="M930 616 H735"/>
  <text x="832" y="600" class="action" text-anchor="middle">② 提交 PR</text>

  <path class="edge" d="M30 730 H70"/>
  <text x="82" y="736" class="note">实线：编辑、导出、提交 PR</text>
  <path class="edge" d="M380 730 H425" stroke-dasharray="7 6"/>
  <text x="437" y="736" class="note">虚线：需另行人工跟进</text>
  <text x="755" y="736" class="note">①②③ 对应正文中的三条维护路径</text>
</svg>
