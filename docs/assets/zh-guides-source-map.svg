<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="645" viewBox="0 0 1160 645" role="img" aria-labelledby="title desc">
<title id="title">中文 Guides 增量翻译的工具链与变更范围</title>
<desc id="desc">沿用英文生成，读取 dev 上固定版本的 Guides 英文。橙色虚线内新增增量起草、PR 候选检查与文档工程师必审，以及 master 上的已审中文目录。日常增量循环从 master 已审中文取底稿和基线；飞书存量底稿仅用于首次建仓的一次性导入（虚线）。下游扩展中文 Fetch 为已切换页读取固定 master 提交，写入 dev 中文发布内容，再经现有站点部署发布。</desc>
<defs>
  <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#64748b"/></marker>
  <marker id="arr-dash" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#94a3b8"/></marker>
</defs>
<style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;text-anchor:middle;fill:#334155}.head{font-size:20px;font-weight:600}.note{font-size:15.5px}.cap{font-size:15px;fill:#475569}.change{font-size:16.5px;fill:#a53c06;font-weight:600}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arr)}.edge-dash{fill:none;stroke:#94a3b8;stroke-width:2;stroke-dasharray:6 4;marker-end:url(#arr-dash)}</style>
