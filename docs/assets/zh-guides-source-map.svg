<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="272" viewBox="0 0 1000 272" role="img" aria-labelledby="title desc">
  <title id="title">中文 Guides 的首次导入与后续更新</title>
  <desc id="desc">首次由 Fetch 读取飞书中文，文档工程师在导入 PR 中对照 Cloud 英文审校，合入后形成 Git 底稿。页面切换后，Cloud 英文的变化触发中文草稿，工程师审校合入，中文随对应版本部署上线。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#64748b"/></marker>
  </defs>
  <style>
    text { font-family: "PingFang SC","Microsoft YaHei",sans-serif; text-anchor: middle; fill: #374151; }
    .heading { font-size: 23px; font-weight: 600; }
    .note { font-size: 18px; fill: #475569; }
    .arrow { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
    .tool { fill: #ddd6fe; stroke: #6d28d9; }
    .review { fill: #dbeafe; stroke: #2563eb; }
  </style>
  <rect width="1000" height="272" fill="white"/>
  <g transform="translate(0 10)">
    <rect x="10" y="0" width="980" height="116" rx="12" fill="white" stroke="#94a3b8"/>
    <text class="heading" x="85" y="52">首次导入</text>
    <text class="note" x="85" y="80">每页一次</text>
    <rect class="tool" x="166" y="17" width="228" height="82" rx="10"/>
    <text class="heading" x="280" y="52">Fetch 取稿</text>
    <text class="note" x="280" y="81">读取飞书已有的中文</text>
    <path class="arrow" d="M401 58 H434"/>
    <rect class="review" x="442" y="17" width="252" height="82" rx="10"/>
    <text class="heading" x="568" y="52">工程师审导入 PR</text>
    <text class="note" x="568" y="81">对照 Cloud Guides 英文</text>
    <path class="arrow" d="M701 58 H734"/>
    <rect x="742" y="17" width="228" height="82" rx="10" fill="#fef3c7" stroke="#b45309"/>
    <text class="heading" x="856" y="52">已审底稿存入 Git</text>
    <text class="note" x="856" y="81">切换前仍在飞书编辑</text>
  </g>
  <g transform="translate(0 146)">
    <rect x="10" y="0" width="980" height="116" rx="12" fill="white" stroke="#94a3b8"/>
    <text class="heading" x="85" y="52">后续更新</text>
    <text class="note" x="85" y="80">页面切换后</text>
    <rect class="tool" x="166" y="17" width="228" height="82" rx="10"/>
    <text class="heading" x="280" y="52">工具起草中文</text>
    <text class="note" x="280" y="81">依据 Cloud 英文的变化</text>
    <path class="arrow" d="M401 58 H434"/>
    <rect class="review" x="442" y="17" width="252" height="82" rx="10"/>
    <text class="heading" x="568" y="52">工程师审更新 PR</text>
    <text class="note" x="568" y="81">确认改动后批准合入</text>
    <path class="arrow" d="M701 58 H734"/>
    <rect x="742" y="17" width="228" height="82" rx="10" fill="white" stroke="#64748b"/>
    <text class="heading" x="856" y="52">中文随版本上线</text>
    <text class="note" x="856" y="81">Fetch 从 Git 取稿部署</text>
  </g>
</svg>
