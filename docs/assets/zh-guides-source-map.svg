<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="122" viewBox="0 0 1040 122" role="img" aria-labelledby="title desc">
  <title id="title">Cloud 中文 Guides 增量翻译工作流</title>
  <desc id="desc">同一手册的英文有变化时，比较上次中文审校对应的英文与本次采用的英文。模型在已审中文上起草局部修改。文档工程师审校 PR，批准合入的中文随对应版本发布。</desc>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#64748b"/></marker></defs>
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; text-anchor: middle; fill: #374151; }
    .title { font-size: 22px; font-weight: 600; }
    .note { font-size: 17px; fill: #475569; }
    .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <rect width="1040" height="122" fill="white"/>
  <rect x="8" y="17" width="226" height="88" rx="10" fill="#fef3c7" stroke="#b45309"/>
  <text x="121" y="54" class="title">Cloud 采用新英文</text>
  <text x="121" y="82" class="note">对照上次已审的英文</text>
  <path class="arrow" d="M240 61 H266"/>
  <rect x="273" y="17" width="226" height="88" rx="10" fill="#ddd6fe" stroke="#6d28d9"/>
  <text x="386" y="54" class="title">模型起草中文改动</text>
  <text x="386" y="82" class="note">只改底稿中受影响的段落</text>
  <path class="arrow" d="M505 61 H531"/>
  <rect x="538" y="17" width="226" height="88" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="651" y="54" class="title">文档工程师审 PR</text>
  <text x="651" y="82" class="note">核对、修订、批准或暂缓</text>
  <path class="arrow" d="M770 61 H797"/>
  <rect x="804" y="17" width="228" height="88" rx="10" fill="white" stroke="#64748b"/>
  <text x="918" y="54" class="title">已审中文发布</text>
  <text x="918" y="82" class="note">合入后随对应版本部署</text>
</svg>
