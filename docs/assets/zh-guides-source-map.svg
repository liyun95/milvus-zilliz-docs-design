<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="613" viewBox="0 0 1160 613" role="img" aria-labelledby="title desc">
<title id="title">中文 Guides 增量翻译的工具链与变更范围</title>
<desc id="desc">沿用英文生成，读取 dev 上固定版本的 Guides 英文。橙色虚线内新增增量起草、文档工程师必审的 PR 和 master · 已审中文。下游扩展中文 Fetch 以读取已切换页的 Git 正文，向 dev 提交中文发布内容，再经现有站点部署发布。飞书供首次取稿，并继续供未迁移页取稿。黄色为文件或内容，紫色为工具处理，蓝色为人工审校，白色节点为站点，橙色虚线框为本期新增范围。</desc>
